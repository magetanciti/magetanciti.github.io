<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/L.Control.Locate.min.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/MarkerCluster.css">
        <link rel="stylesheet" href="css/MarkerCluster.Default.css">
        <link rel="stylesheet" href="css/leaflet-search.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <title>PETA BATAS KELURAHAN KOTA SEMARANG</title>
    </head>
    <body>
        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/L.Control.Locate.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="js/leaflet.markercluster.js"></script>
        <script src="js/leaflet-search.js"></script>
        <script src="data/penduduk.js"></script>
        <script src="data/Petabatas_3.js"></script>
        <script src="data/Kantor_Kelurahan_4.js"></script>
        <script src="data/TPS_KOTA_SEMARANG_2026.js"></script>
        <script src="data/kecamatan.js"></script>
        <script src="data/kantorKec.js"></script>
        <script src="js/map.js" defer></script>  
<link rel="stylesheet" href="css/custom.css">   
<!-- Panel toggle & filter -->
<button id="togglePanel">☰</button>
<div id="customPanel">
  <h4>Layer Titik</h4>
  <label><input type="checkbox" id="layerKantor" checked> Kantor Kelurahan</label>
  <label><input type="checkbox" id="layerKantorKec" checked> Kantor Kecamatan</label>
  <label><input type="checkbox" id="layerTPS" checked> TPS</label>

  <h4>Layer Batas</h4>
  <label><input type="radio" name="layerBatasGroup" id="layerKecamatan" value="kecamatan" checked> Batas Kecamatan</label>
  <label><input type="radio" name="layerBatasGroup" id="layerBatas" value="kelurahan"> Batas Kelurahan</label>
  <label><input type="radio" name="layerBatasGroup" id="layerBatasNone" value="none"> Tanpa Batas</label>
  
  <label style="display:block; margin-top:10px; font-size:12px; font-weight:bold;">Transparansi Batas:</label>
  <input type="range" id="opacitySlider" min="0" max="1" step="0.1" value="0.7" style="width: 100%;">

  <h4>Filter Kecamatan</h4>
  <select id="filterKecamatan">
    <option value="All">Semua Kecamatan</option>
  </select>

  <label for="filterKelurahan">Filter Kelurahan:</label>
  <select id="filterKelurahan" disabled>
    <option value="All">Semua Kelurahan</option>
  </select>

  <h4>Basemap</h4>
  <label><input type="radio" name="basemap" value="osm" checked> OpenStreetMap</label>
  <label><input type="radio" name="basemap" value="satellite"> Citra Satelit (Google)</label>
  <label><input type="radio" name="basemap" value="gray"> Peta Abu-Abu (Esri Gray)</label>
  <h4>Ekspor</h4>
  <button id="downloadKecSvg">Download SVG Kecamatan</button>
</div>

<script src="js/panel.js" defer></script>

			
    </body>
</html>
